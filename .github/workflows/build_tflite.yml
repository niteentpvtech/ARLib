name: Build TFLite 16KB AAR
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          df -h

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          sudo apt-get install -y python3 python3-pip clang-14
          sudo update-alternatives --install /usr/bin/clang clang /usr/lib/llvm-14/bin/clang 100
          pip3 install "numpy<2.0"

      - name: Install Bazel 6.1.0
        run: |
          wget -q https://github.com/bazelbuild/bazel/releases/download/6.1.0/bazel-6.1.0-installer-linux-x86_64.sh
          chmod +x bazel-6.1.0-installer-linux-x86_64.sh
          sudo ./bazel-6.1.0-installer-linux-x86_64.sh

      - name: Install Android NDK r21e
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip -O ndk.zip
          unzip -q -o ndk.zip -d $HOME
          rm ndk.zip
          echo "NDK ready: $(ls $HOME/android-ndk-r21e/toolchains/ | head -3)"

      - name: Install Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O sdk.zip
          unzip -q sdk.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          rm sdk.zip
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "build-tools;30.0.3" "platforms;android-21"

      - name: Clone TensorFlow 2.14.1
        run: |
          git clone --depth=1 --branch v2.14.1 \
            https://github.com/tensorflow/tensorflow.git /home/runner/tensorflow

      - name: Patch TF source for clang-14 compatibility
        run: |
          # Fix missing cstdint includes that clang-14 requires
          sed -i '1s/^/#include <cstdint>\n/' /home/runner/tensorflow/tensorflow/tsl/lib/io/cache.h

      - name: Configure TensorFlow
        working-directory: /home/runner/tensorflow
        run: |
          export PYTHON_BIN_PATH=$(which python3)
          export PYTHON_LIB_PATH=$(python3 -c "import site; print(site.getsitepackages()[0])")
          export TF_NEED_CUDA=0
          export TF_NEED_ROCM=0
          export TF_NEED_CLANG=1
          export CLANG_COMPILER_PATH=$(which clang)
          export ANDROID_NDK_HOME=/home/runner/android-ndk-r21e
          export ANDROID_SDK_HOME=/home/runner/android-sdk
          export ANDROID_BUILD_TOOLS_VERSION=30.0.3
          export ANDROID_API_LEVEL=21
          yes "" | ./configure

      - name: Setup Bazel cache and linker flags
        working-directory: /home/runner/tensorflow
        run: |
          mkdir -p /home/runner/bazel-cache
          echo "build --disk_cache=/home/runner/bazel-cache" >> .bazelrc
          echo 'build --linkopt=-Wl,-z,max-page-size=16384' >> .bazelrc

      - name: Build select-tf-ops AAR only
        working-directory: /home/runner/tensorflow
        run: |
          # Build select-tf-ops with Android config (faster, more targeted)
          bazel build -c opt \
            --config=android_arm64 \
            --linkopt=-Wl,-z,max-page-size=16384 \
            //tensorflow/lite/java:tensorflow-lite-select-tf-ops

      - name: Verify 16KB alignment
        run: |
          unzip -p /home/runner/tensorflow/bazel-bin/tensorflow/lite/java/tensorflow-lite-select-tf-ops.aar \
            "jni/arm64-v8a/libtensorflowlite_flex_jni.so" > /tmp/flex.so
          readelf -l /tmp/flex.so | grep -A2 "LOAD"

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: tensorflow-lite-select-tf-ops-16kb-aar
          path: /home/runner/tensorflow/bazel-bin/tensorflow/lite/java/tensorflow-lite-select-tf-ops.aar
          retention-days: 7
